services:
  postgres:
    image: postgres:16-alpine
    container_name: flownote-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: flownote
      POSTGRES_USER: flownote
      POSTGRES_PASSWORD: flownote
    ports:
      - "5432:5432"
    volumes:
      - flownote_postgres_data:/var/lib/postgresql/data

volumes:
  flownote_postgres_data:
